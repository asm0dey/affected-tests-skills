// Applies test-order to every Java/Kotlin project without editing build files.
// Usage: ./gradlew test --init-script test-order-init.gradle
// Replace VERSION with the released test-order version (check_versions.py -> maven.latest).
// shortcut: resolves the Gradle plugin from mavenLocal() because it isn't published yet; build it
// from the matching release tag first (see SKILL.md), and switch to the plugins block once
// check_versions.py reports gradle.published = true.
initscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath 'me.bechberger:test-order-gradle-plugin:VERSION'
    }
}
projectsLoaded {
    allprojects { project ->
        if (project.projectDir.name == 'buildSrc') return
        project.plugins.withId('java') {
            project.apply plugin: me.bechberger.testorder.gradle.TestOrderPlugin
        }
    }
}
